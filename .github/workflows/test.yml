name: Windows tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      B2PS_REQUIRE_BASH: "1"
      B2PS_BASH: 'C:\Program Files\Git\bin\bash.exe'
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify PowerShell versions
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion'
      - name: Run conversion and PowerShell integration tests
        run: python -m unittest discover -s tests -v
      - name: Check desktop file context and clipboard state
        run: python tests/preview_ui.py
      - name: Check CLI example
        run: python app.py examples/setup.sh -o cli-example.ps1
