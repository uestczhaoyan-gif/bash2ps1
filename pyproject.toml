[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bash2ps1"
version = "0.1.0"
description = "A local desktop converter for common Bash steps to PowerShell 5.1 and 7"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Utilities",
]

[project.scripts]
bash2ps1 = "app:main"

[project.gui-scripts]
bash2ps1-gui = "app:gui_main"

[tool.setuptools]
py-modules = ["app", "converter"]
