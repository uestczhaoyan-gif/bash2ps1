[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bash2ps1"
version = "1.0.0"
description = "Convert common Bash scripts to native PowerShell 5.1/7 with diagnostics and bundled child scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Utilities",
]

[project.scripts]
bash2ps1 = "app:main"

[project.gui-scripts]
bash2ps1-gui = "app:gui_main"

[tool.setuptools]
py-modules = ["app", "converter", "compiler", "arithmetic", "shellsyntax", "runtime_core", "native_runtime", "psruntime", "command_runtime", "text_runtime", "command_specs"]
